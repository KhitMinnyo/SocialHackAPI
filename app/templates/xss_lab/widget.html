<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Widget {{ widget.id }} - SocialHack XSS Lab</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    .sh-lab-banner { background:#fff3cd; border:1px solid #ffe08a; padding:10px 14px; border-radius:6px; margin-bottom:20px; font-size:14px; }
    .sh-widget-box { border:1px solid #ddd; border-radius:8px; padding:16px; }
    code { background:#f3f3f3; padding:1px 5px; border-radius:3px; }
  </style>
</head>
<body>
  <div class="sh-lab-banner">
    ⚠️ <strong>XSS Lab page</strong> — isolated from the main SocialHack app (<code>/app/*</code>, which has
    no intentional vulnerabilities of its own). This page renders widget content
    <strong>without escaping</strong> on purpose. See
    <code>cheatsheets/beyond-lab-xss-oauth-cheatsheet.md</code>.
  </div>
  <h2>Guestbook widget #{{ widget.id }}</h2>
  <div class="sh-widget-box">
    {{ widget.content | safe }}
  </div>
</body>
</html>
