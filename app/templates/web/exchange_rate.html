{% extends "web/base.html" %}
{% block title %}Exchange Rate - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">
  <p class="sh-muted"><a href="/app/integrations">&larr; Integrations</a></p>

  <div class="sh-card">
    <h2 style="margin-top:0;">Exchange Rate</h2>

    <form id="sh-rate-form">
      <label class="sh-muted" for="rateProvider" style="display:block; margin-bottom:4px;">Provider URL</label>
      <input class="sh-input" type="text" id="rateProvider" required style="width:100%; margin-bottom:10px; box-sizing:border-box;">
      <button class="sh-btn" type="submit">Fetch rate</button>
    </form>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-rate-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/exchange-rate.js') }}"></script>
{% endblock %}
