{% extends "web/base.html" %}
{% block title %}Verification - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">

  <div class="sh-card">
    <h2 style="margin-top:0;">Get verified</h2>

    <div id="sh-status">
      <p class="sh-muted">Loading...</p>
    </div>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-apply-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/verification.js') }}"></script>
{% endblock %}
