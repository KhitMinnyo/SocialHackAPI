{% extends "web/base.html" %}
{% block title %}Search - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">

  <div class="sh-card">
    <form id="sh-search-form" style="display:flex; gap:8px;">
      <input class="sh-input" id="searchQuery" type="text" placeholder="Search SocialHack" required
        style="flex:1; box-sizing:border-box;">
      <button class="sh-btn" type="submit">Search</button>
    </form>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-search-result" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
