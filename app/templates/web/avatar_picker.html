{% extends "web/base.html" %}
{% block title %}Avatar - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">

  <div class="sh-card">
    <h2 style="margin-top:0;">Choose an avatar</h2>

    <div id="sh-avatar-grid" style="display:flex; gap:14px; flex-wrap:wrap; margin-top:12px;"></div>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-avatar-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/avatar-picker.js') }}"></script>
{% endblock %}
