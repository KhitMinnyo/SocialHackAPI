{% extends "web/base.html" %}
{% block title %}Ping - Developer - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">
  <p class="sh-muted"><a href="/app/developer">&larr; Developer</a></p>

  <div class="sh-card">
    <h2 style="margin-top:0;">Ping</h2>

    <form id="sh-ping-form">
      <label class="sh-muted" for="pingHost" style="display:block; margin-bottom:4px;">Host</label>
      <input class="sh-input" type="text" id="pingHost" required style="width:100%; margin-bottom:10px; box-sizing:border-box;">
      <button class="sh-btn" type="submit">Ping</button>
    </form>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-ping-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/dev-ping.js') }}"></script>
{% endblock %}
