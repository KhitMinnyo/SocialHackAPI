{% extends "web/base.html" %}
{% block title %}DNS Lookup - Developer - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">
  <p class="sh-muted"><a href="/app/developer">&larr; Developer</a></p>

  <div class="sh-card">
    <h2 style="margin-top:0;">DNS Lookup</h2>

    <form id="sh-dns-form">
      <label class="sh-muted" for="dnsDomain" style="display:block; margin-bottom:4px;">Domain</label>
      <input class="sh-input" type="text" id="dnsDomain" required style="width:100%; margin-bottom:10px; box-sizing:border-box;">
      <button class="sh-btn" type="submit">Look up</button>
    </form>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-dns-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/dev-dns-lookup.js') }}"></script>
{% endblock %}
