{% extends "web/base.html" %}
{% block title %}Forgot password - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">
  <div class="sh-card">
    <h2>Forgot your password?</h2>
    <p class="sh-muted">Enter your account email and we'll send you a reset code.</p>
    <div id="sh-error" class="sh-error sh-hidden"></div>
    <div id="sh-success" class="sh-success sh-hidden"></div>

    <form id="sh-forgot-form">
      <div class="sh-form-group">
        <label for="email">Account email</label>
        <input class="sh-input" type="email" id="email" name="email" required autocomplete="email" placeholder="alice@socialhack.local">
      </div>
      <button class="sh-btn" type="submit" id="sh-forgot-btn">Send reset email</button>
    </form>

    <div id="sh-inbox-link"></div>

    <p class="sh-muted" style="margin-top:14px;">
      Remembered it? <a href="/app/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/forgot-password.js') }}"></script>
{% endblock %}
