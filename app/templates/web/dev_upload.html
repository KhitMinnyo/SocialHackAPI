{% extends "web/base.html" %}
{% block title %}Upload Document - Developer - SocialHack{% endblock %}
{% block content %}
<div class="sh-container">
  <p class="sh-muted"><a href="/app/developer">&larr; Developer</a></p>

  <div class="sh-card">
    <h2 style="margin-top:0;">Upload Document</h2>

    <form id="sh-upload-form">
      <label class="sh-muted" for="uploadFile" style="display:block; margin-bottom:4px;">File</label>
      <input type="file" id="uploadFile" style="margin-bottom:10px; display:block;">

      <label class="sh-muted" for="uploadFilename" style="display:block; margin-bottom:4px;">Filename</label>
      <input class="sh-input" type="text" id="uploadFilename" required style="width:100%; margin-bottom:10px; box-sizing:border-box;">

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="sh-btn" type="submit">Upload</button>
        <button class="sh-btn" type="button" id="sh-view-btn">View / Open file</button>
      </div>
    </form>

    <div id="sh-error" class="sh-error sh-hidden" style="margin-top:10px;"></div>
    <div id="sh-upload-result" class="sh-hidden" style="margin-top:14px;"></div>
    <div id="sh-view-result" class="sh-hidden" style="margin-top:14px;"></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/dev-upload.js') }}"></script>
{% endblock %}
